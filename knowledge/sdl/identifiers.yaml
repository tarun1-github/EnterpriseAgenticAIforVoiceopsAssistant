version: "1.0.0"
category: "cucm_identifiers"
source: "Cisco CUCM SDL Trace Identifier Reference"

identifiers:
  - name: CI
    full_name: Call Identification
    description: 32-bit unique integer assigned to every individual call leg within a CUCM cluster.
    scope: Node-wide / Cluster-wide unique within retention window
    format: Decimal integer (e.g. CI=33554432)
    importance: Critical for correlating signals belonging to the same call leg across processes.
    confidence: high
    source_reference: "Cisco CUCM CallManager SDL Architecture"

  - name: CDCC
    full_name: Call Deflection / Control Block ID
    description: Identifier representing the active Cdcc control instance managing the call context.
    format: Decimal integer or process tuple (e.g. cdcc=1234567 or Cdcc(1,100,20,5))
    importance: Connects originating and terminating call legs together within CUCM core.
    confidence: high
    source_reference: "Troubleshooting Cisco IP Telephony"

  - name: Call-ID
    full_name: SIP Call Identifier
    description: Globally unique SIP Call-ID header string generated by user agent client (UAC).
    format: Alphanumeric string with host/domain (e.g. 12345678@10.197.206.141)
    importance: Matches external network SIP signaling to internal CUCM SIPCdpc process.
    confidence: high
    source_reference: "IETF RFC 3261 / Cisco SIP Implementation Guide"

  - name: ccbID
    full_name: Call Control Block Identifier
    description: Internal identifier linking SIP protocol daemon state to CUCM SIPHandler.
    format: Decimal integer (e.g. ccbID= 6980)
    importance: Useful when SIP Call-ID is masked or in options pings.
    confidence: medium
    source_reference: "Cisco CUCM Diagnostic Tracing"
